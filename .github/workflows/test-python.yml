name: Test Python SDK

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest moved to 24.04-based images that no longer ship a 3.9 build, so the oldest
    # interpreter in the support matrix runs on 22.04 while the rest stay on latest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run pytest
        run: python -m pytest tests -q
